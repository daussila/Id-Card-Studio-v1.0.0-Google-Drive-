<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
.album-design-card {position:relative;overflow:hidden;box-sizing:border-box;background:#fff;border:1px solid #98a2b3;box-shadow:0 12px 28px rgba(23,32,51,.16)}
.album-design-card * {box-sizing:border-box}
.album-lanyard {position:absolute;z-index:999;top:7px;left:50%;width:56px;height:12px;transform:translateX(-50%);border:1px dashed #98a2b3;border-radius:8px;pointer-events:none}
.album-lanyard.round {top:8px;width:14px;height:14px;border-radius:50%}
.album-element {position:absolute;min-width:1px;min-height:1px;display:flex;align-items:center;justify-content:center;overflow:visible;transform-origin:center}
.album-element-text {display:block;width:100%;min-width:0;max-width:100%;max-height:100%;padding:1px 2px;line-height:1.08;white-space:normal;overflow-wrap:anywhere;word-break:normal;overflow:hidden}
.album-element img {display:block;width:100%;height:100%;object-fit:contain}
.album-element.album-photo {overflow:hidden;border:1px dashed #7b8ba4;border-radius:7px;background:#f3f6fa}
.album-element.album-photo img {object-fit:cover}
.album-photo-placeholder {display:grid;place-items:center;width:100%;height:100%;color:#667085;background:#f3f6fa;font-size:10px;font-weight:750}
.album-barcode {display:block;width:100%;height:100%}
.album-qr {display:grid;place-items:center;width:100%;height:100%;background:#fff}
.album-qr svg {display:block;width:100%;height:100%}
.album-grade {display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px;width:100%;height:100%}
.album-grade span {display:flex;min-width:0;height:100%;overflow:hidden}
.album-grade.grade-pair-aligned {grid-auto-rows:max-content;align-items:baseline}
.album-grade.grade-pair-aligned span {height:auto;align-items:baseline!important}
.album-transport {display:flex;align-items:center;justify-content:center;width:100%;height:100%}
.album-transport svg {width:90%;height:90%}
</style>
<script>
window.CardDesignRuntime = (function () {
  'use strict';
  /**
   * Card sizes (short side × long side). Screen pixels use 96 per inch;
   * printing uses the exact millimetre size.
   */
  const PX_PER_INCH = 96;
  const CARD_SIZES = {
    cr80: {name: 'CR80', inches: [2.125, 3.375], mm: [53.98, 85.60], note: 'Standard ID card (credit-card size)'},
    cr79: {name: 'CR79', inches: [2.051, 3.303], mm: [52.1, 83.9], note: 'Slightly smaller, e.g. stickers for access cards'},
    cr90: {name: 'CR90', inches: [2.37, 3.63], mm: [60.2, 92.1], note: 'Larger ID card'},
    cr100: {name: 'CR100', inches: [2.63, 3.88], mm: [66.8, 98.5], note: 'Oversize visitor or event badge'},
    badge43: {name: '3 × 4 in badge', inches: [3, 4], mm: [76.2, 101.6], note: 'Paper or plastic badge for events and visitors'},
    id2: {name: 'ID-2', inches: [2.91, 4.13], mm: [74, 105], note: 'Large ID document size'}
  };
  const PUNCH_LABELS = {none: 'no hole', slot: 'slot', round: 'round hole'};
  /** Designs saved before sizes existed used one of these four names. */
  const LEGACY_TYPES = {
    'portrait-hole': {size: 'cr80', orientation: 'portrait', punch: 'slot'},
    'landscape-hole': {size: 'cr80', orientation: 'landscape', punch: 'slot'},
    'portrait-plain': {size: 'cr80', orientation: 'portrait', punch: 'none'},
    'landscape-plain': {size: 'cr80', orientation: 'landscape', punch: 'none'}
  };
  /** The card's format: {size, orientation, punch, customWidth, customHeight} (custom sizes in inches). */
  function cardFormat(design) {
    design = design || {};
    const legacy = LEGACY_TYPES[design.cardType] || LEGACY_TYPES['portrait-hole'];
    const size = design.cardSize === 'custom' || CARD_SIZES[design.cardSize] ? design.cardSize : legacy.size;
    const clampInches = (value, fallback) => {
      const number = Number(value);
      return Number.isFinite(number) ? Math.max(1, Math.min(8.5, Math.round(number * 1000) / 1000)) : fallback;
    };
    return {
      size: size,
      orientation: design.cardOrientation === 'landscape' || design.cardOrientation === 'portrait' ? design.cardOrientation : legacy.orientation,
      punch: PUNCH_LABELS[design.cardPunch] ? design.cardPunch : legacy.punch,
      customWidth: clampInches(design.customWidth, 2.125),
      customHeight: clampInches(design.customHeight, 3.375)
    };
  }
  /** Pixel and millimetre size, hole style and a readable label for a design. */
  function cardSpec(design) {
    const format = cardFormat(design);
    let inches, mm, name;
    if (format.size === 'custom') {
      // Custom sizes are used exactly as typed (width × height).
      inches = [format.customWidth, format.customHeight];
      mm = inches.map(value => Math.round(value * 25.4 * 100) / 100);
      name = 'Custom';
    } else {
      const size = CARD_SIZES[format.size];
      const landscape = format.orientation === 'landscape';
      inches = landscape ? [size.inches[1], size.inches[0]] : size.inches.slice();
      mm = landscape ? [size.mm[1], size.mm[0]] : size.mm.slice();
      name = size.name;
    }
    const width = Math.round(inches[0] * PX_PER_INCH);
    const height = Math.round(inches[1] * PX_PER_INCH);
    const direction = width > height ? 'landscape' : 'portrait';
    const show = number => String(Math.round(number * 1000) / 1000);
    return {
      width: width, height: height, widthMm: mm[0], heightMm: mm[1],
      punch: format.punch, hole: format.punch !== 'none', size: format.size, orientation: direction,
      inchLabel: show(inches[0]) + ' × ' + show(inches[1]) + ' in',
      mmLabel: mm[0].toFixed(2) + ' × ' + mm[1].toFixed(2) + ' mm',
      label: name + ' ' + direction + ', ' + PUNCH_LABELS[format.punch]
    };
  }
  const FONT_SIZE_MIN = 1;
  const FONT_SIZE_MAX = 72;
  /** Names of spreadsheet fields (the same names as in Design Studio). */
  const DATA_LABELS = {
    fullName: 'Full Name', firstName: 'First Name', middleName: 'Middle Name', lastName: 'Last Name',
    idNumber: 'ID Number', barcodeNumber: 'Barcode', qrCode: 'QR Code',
    class: 'Grade Level', section: 'Class / Section', homeroom: 'Homeroom / Advisory', teacherName: 'Teacher Name', transportation: 'Transportation',
    title: 'Job Title', department: 'Department', campus: 'Campus', buildingRoom: 'Building / Room',
    email: 'Email', phone: 'Phone', address: 'Address', emergencyContact: 'Emergency Contact', emergencyPhone: 'Emergency Phone',
    dateOfBirth: 'Date of Birth', issueDate: 'Issue Date', expirationDate: 'Expiration Date', bloodType: 'Blood Type',
    text: 'Other Column'
  };
  /** Elements whose content comes from the design itself, never from a column. */
  const DESIGN_ONLY_TYPES = ['schoolYear', 'logo', 'image', 'photo', 'signature', 'instructions', 'divider', 'rectangle', 'circle', 'icon'];
  /** Elements that contain no fitted text. */
  const NON_TEXT_TYPES = ['signature', 'divider', 'rectangle', 'circle', 'logo', 'image', 'photo', 'barcodeNumber', 'qrCode', 'transportation'];
  /** Last render arguments per mount, used to re-render both sides for printing. */
  const renderContexts = new WeakMap();

  function sideElements(design, side) {
    if (side === 'back') return Array.isArray(design.backElements) ? design.backElements : [];
    return Array.isArray(design.frontElements) ? design.frontElements : Array.isArray(design.elements) ? design.elements : [];
  }
  function allElements(design) {
    return sideElements(design, 'front').concat(sideElements(design, 'back'));
  }

  // ---------- Data binding ----------
  function normalized(value) {
    return String(value || '').trim().toLowerCase().replace(/[^a-z0-9]+/g, ' ');
  }
  function aliases(value) {
    return String(value || '').split(',').map(normalized).filter(Boolean);
  }
  function transportName(value, model) {
    const target = normalized(value);
    const rules = model || {};
    if (!target || aliases(rules.transportNoneValues || 'None, N/A, No Transportation').includes(target)) return 'None';
    if (aliases(rules.transportBusValues || 'Bus, School Bus').includes(target)) return 'Bus';
    if (aliases(rules.transportWalkValues || 'Walk, Walking, Walker').includes(target)) return 'Walking';
    if (aliases(rules.transportPickupValues || 'Pick Up, Pickup, Car, Car Rider, Parent Pickup').includes(target)) return 'Pick Up';
    return 'None';
  }
  function toIndex(value) {
    const index = value !== undefined && value !== null && value !== '' ? Number(value) : -1;
    return Number.isInteger(index) && index >= 0 ? index : -1;
  }
  /** Column precedence: explicit map → mapping applied to the design → legacy columnIndex. */
  function mappedColumnIndex(model, options) {
    if (!model || DESIGN_ONLY_TYPES.includes(model.type)) return -1;
    if (options && Object.prototype.hasOwnProperty.call(options, 'columnMap')) {
      return toIndex((options.columnMap || {})[model.id]);
    }
    if (Object.prototype.hasOwnProperty.call(model, 'runtimeColumnIndex')) return toIndex(model.runtimeColumnIndex);
    return toIndex(model.columnIndex);
  }
  function hasDataLink(model, options) {
    return mappedColumnIndex(model, options) >= 0;
  }
  /** Returns the mapped cell value, or null when the element is not linked. */
  function boundValue(model, record, options) {
    const index = mappedColumnIndex(model, options);
    if (index < 0) return null;
    const row = record && Array.isArray(record._row) ? record._row : [];
    return index < row.length ? String(row[index] == null ? '' : row[index]) : '';
  }
  /** Placeholder content shown in Design Studio (options.samples). */
  const SAMPLE_VALUES = {idNumber: 'ID #: ID Number', barcodeNumber: '123456789', qrCode: 'QR Code', class: 'Level', transportation: 'Bus', section: '12A'};
  function field(model, record, options) {
    if (['schoolYear', 'instructions', 'icon'].includes(model.type)) {
      return model.text || (options.samples && model.type === 'schoolYear' ? 'Enter the academic year, e.g. 2026–2027' : '');
    }
    if (options.sampleValues) {
      const sample = String(options.sampleValues[model.type] || '');
      if (model.type === 'idNumber') return sample ? 'ID #: ' + sample : '';
      if (model.type === 'transportation') return transportName(sample, model);
      return sample;
    }
    if (options.samples) return SAMPLE_VALUES[model.type] || DATA_LABELS[model.type] || 'Data';
    if (options.emptyPreview) return '';
    const bound = boundValue(model, record, options);
    if (bound === null) return '';
    if (model.type === 'idNumber') return bound ? 'ID #: ' + bound : '';
    if (model.type === 'transportation') return transportName(bound, model);
    return bound;
  }

  // ---------- Visual helpers ----------
  function drawQr(host, value) {
    if (typeof qrcode !== 'function') {
      host.textContent = 'QR';
      return;
    }
    try {
      const qr = qrcode(0, 'M');
      qr.addData(value || ' ');
      qr.make();
      host.innerHTML = qr.createSvgTag({cellSize: 2, margin: 0, scalable: true});
      const svg = host.querySelector('svg');
      if (svg) {
        svg.setAttribute('width', '100%');
        svg.setAttribute('height', '100%');
        svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
      }
    } catch (error) {
      host.textContent = 'Invalid QR';
    }
  }
  function transportIcon(type) {
    const emoji = {Bus: '🚌', 'Pick Up': '🚗'}[type];
    if (emoji) return '<div class="album-transport" title="' + type + '"><svg viewBox="0 0 24 24" role="img" aria-label="' + type + '"><text x="12" y="19" text-anchor="middle" font-size="20">' + emoji + '</text></svg></div>';
    if (type === 'Walking') return '<div class="album-transport" title="Walking"><svg viewBox="0 0 24 24" role="img" aria-label="Walking" fill="#27ae60"><circle cx="12" cy="3.5" r="2"/><path d="M10.2 7.1c.8-.7 2.8-.7 3.6 0l1.6 1.7c.8.8 1.8 1.3 3 1.4l-.2 2c-1.7-.1-3.2-.8-4.4-2l-.3-.3-.5 3 2.3 2.4V22h-2.2v-5.7l-2-1.9-1 3.2L7.7 22H5.2l2.9-5.4 1.1-5.8-1.4 1.4c-.8.8-1.8 1.3-2.9 1.5l-.4-2c.8-.2 1.4-.5 2-1.1l3.7-3.5z"/></svg></div>';
    return '';
  }
  function clampFontSize(value, fallback) {
    const number = Number(value);
    return Math.max(FONT_SIZE_MIN, Math.min(FONT_SIZE_MAX, Number.isFinite(number) ? number : fallback || 12));
  }
  function normalizeTypography(design) {
    allElements(design).forEach(model => {
      if (!model) return;
      if (model.type === 'class') {
        model.classLabelSize = clampFontSize(model.classLabelSize, 12);
        model.classValueSize = clampFontSize(model.classValueSize, 12);
      } else if (!NON_TEXT_TYPES.includes(model.type)) {
        model.fontSize = clampFontSize(model.fontSize, 12);
      }
    });
    return design;
  }

  /**
   * Shrinks text until it fits its box; maxFontSize is the designer's size.
   * Self-contained: the print preview window re-uses it via toString().
   */
  function fitTextToBox(host, text, maxFontSize, preferredAlign) {
    if (!host || !text || !String(text.textContent || '').trim()) return;
    text.dataset.fitMaxFontSize = String(maxFontSize || 12);
    text.dataset.fitAlign = preferredAlign || '';
    text.dataset.fitSelf = host === text ? 'true' : 'false';
    const applyFit = function () {
      const max = Math.max(1, Number(maxFontSize) || 12);
      const availableWidth = host.clientWidth;
      // Grade segments size to their text, so measure against the grade box.
      const gradeBox = host === text && host.parentElement && host.parentElement.classList.contains('album-grade') ? host.parentElement : null;
      const availableHeight = gradeBox ? gradeBox.clientHeight : host.clientHeight;
      if (availableWidth < 1 || availableHeight < 1) return;
      Object.assign(text.style, {
        maxWidth: '100%', maxHeight: 'none', overflow: 'visible', flexShrink: '0', boxSizing: 'border-box',
        letterSpacing: 'normal', wordSpacing: 'normal', overflowWrap: 'anywhere', wordBreak: 'normal',
        textAlign: preferredAlign || text.style.textAlign || 'center', textAlignLast: 'auto'
      });
      const heightLimit = Math.max(1, availableHeight - (gradeBox ? 0 : 1));
      const fits = () => text.scrollWidth <= availableWidth && text.scrollHeight <= heightLimit;
      text.style.fontSize = max + 'px';
      if (!fits()) {
        let low = 0.1;
        let high = max;
        let best = low;
        for (let pass = 0; pass < 18; pass++) {
          const candidate = (low + high) / 2;
          text.style.fontSize = candidate + 'px';
          if (fits()) { best = candidate; low = candidate; } else high = candidate;
        }
        text.style.fontSize = Math.max(0.1, Math.floor(best * 100) / 100) + 'px';
      }
    };
    applyFit();
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(() => { if (text.isConnected) applyFit(); });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (text.isConnected) applyFit(); });
  }
  function fitDataElement(node, model) {
    if (NON_TEXT_TYPES.includes(model.type)) return;
    if (model.type === 'class') {
      const segments = node.querySelectorAll('.album-grade span');
      fitTextToBox(segments[0], segments[0], Number(model.classLabelSize || 12), '');
      fitTextToBox(segments[1], segments[1], Number(model.classValueSize || 12), '');
      return;
    }
    fitTextToBox(node, node.querySelector('.album-element-text'), Number(model.fontSize || 12), model.align || 'center');
  }

  function gradeSegment(text, model, prefix, defaults) {
    const span = document.createElement('span');
    span.textContent = text;
    Object.assign(span.style, {
      fontFamily: model[prefix + 'Font'] || 'Segoe UI, Arial, sans-serif',
      fontSize: Number(model[prefix + 'Size'] || 12) + 'px',
      color: model[prefix + 'Color'] || defaults.color,
      fontWeight: model[prefix + 'Weight'] || defaults.weight,
      fontStyle: model[prefix + 'Italic'] ? 'italic' : 'normal',
      justifyContent: model[prefix + 'Align'] || defaults.align,
      alignItems: model[prefix + 'VerticalAlign'] || 'center'
    });
    return span;
  }

  function renderElement(model, design, record, options) {
    const node = document.createElement('div');
    node.className = 'album-element' + (model.type === 'photo' ? ' album-photo' : '');
    Object.assign(node.style, {
      left: Number(model.x || 0) + 'px', top: Number(model.y || 0) + 'px',
      width: Number(model.w || 20) + 'px', height: Number(model.h || 18) + 'px',
      zIndex: String(model.z || 1),
      color: model.color || '#111827',
      backgroundColor: model.backgroundColor || 'transparent',
      borderColor: model.borderColor || '#667085',
      borderStyle: Number(model.borderWidth || 0) > 0 ? 'solid' : 'none',
      borderWidth: Number(model.borderWidth || 0) + 'px',
      opacity: String(model.opacity === undefined ? 1 : model.opacity),
      fontSize: Number(model.fontSize || 12) + 'px',
      fontWeight: model.fontWeight || '400',
      fontFamily: model.fontFamily || 'Segoe UI, Arial, sans-serif',
      fontStyle: model.italic ? 'italic' : 'normal',
      textDecoration: [model.underline ? 'underline' : '', model.strike ? 'line-through' : ''].filter(Boolean).join(' ') || 'none',
      textAlign: model.align || 'center',
      justifyContent: model.align === 'left' ? 'flex-start' : model.align === 'right' ? 'flex-end' : 'center',
      alignItems: model.verticalAlign || 'center',
      transform: 'rotate(' + Number(model.rotation || 0) + 'deg)'
    });
    const addImage = (src, alt, sample) => {
      if (!src) {
        if (options.samples) node.textContent = sample;
        return;
      }
      const image = document.createElement('img');
      image.src = src;
      image.alt = alt;
      node.appendChild(image);
    };

    if (['divider', 'rectangle', 'circle'].includes(model.type)) {
      node.style.borderRadius = model.type === 'circle' ? '50%' : '0';
    } else if (model.type === 'logo') {
      addImage(model.imageData || design.logoData, 'Card logo', 'LOGO');
    } else if (model.type === 'image' || model.type === 'signature') {
      addImage(model.imageData, model.type === 'signature' ? 'Signature' : 'Card image', model.type === 'signature' ? 'SIGNATURE' : 'IMAGE');
    } else if (model.type === 'photo') {
      if (options.photoData) {
        addImage(options.photoData, 'ID photo');
        // Fit: 'cover' fills the frame (edges may be cropped), 'contain' shows the whole photo.
        // Focus: which part stays visible when cropping (top keeps faces in view).
        const image = node.querySelector('img');
        image.style.objectFit = model.photoFit === 'contain' ? 'contain' : 'cover';
        image.style.objectPosition = 'center ' + (['top', 'bottom'].includes(model.photoFocus) ? model.photoFocus : 'center');
      }
      else {
        const placeholder = document.createElement('div');
        placeholder.className = 'album-photo-placeholder';
        placeholder.textContent = options.samples ? 'PHOTO' : options.emptyPreview ? '' : options.photoLoading ? 'LOADING...' : options.photoError ? 'PHOTO ERROR' : 'NO PHOTO';
        node.appendChild(placeholder);
      }
    } else if (model.type === 'barcodeNumber') {
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.classList.add('album-barcode');
      node.appendChild(svg);
      const value = field(model, record, options);
      if (value && typeof JsBarcode === 'function') {
        try {
          JsBarcode(svg, value, {format: 'CODE128', width: 1.25, height: Math.max(18, Number(model.h || 40)), displayValue: false, margin: 0});
        } catch (error) { /* invalid barcode data: leave blank */ }
      }
    } else if (model.type === 'qrCode') {
      const qr = document.createElement('div');
      qr.className = 'album-qr';
      node.appendChild(qr);
      const value = field(model, record, options);
      if (value) drawQr(qr, value);
    } else if (model.type === 'class') {
      const box = document.createElement('div');
      box.className = 'album-grade';
      const label = gradeSegment(options.samples || options.sampleValues || (!options.emptyPreview && hasDataLink(model, options)) ? 'Grade' : '', model, 'classLabel', {color: '#185adb', weight: '700', align: 'flex-end'});
      const value = gradeSegment(field(model, record, options), model, 'classValue', {color: '#111827', weight: '900', align: 'flex-start'});
      const vertical = model.classLabelVerticalAlign || 'center';
      if (vertical === (model.classValueVerticalAlign || 'center')) {
        box.classList.add('grade-pair-aligned');
        box.style.alignContent = vertical === 'flex-start' ? 'start' : vertical === 'flex-end' ? 'end' : 'center';
        [label, value].forEach(span => { span.style.height = 'auto'; span.style.alignItems = 'baseline'; });
      }
      box.append(label, value);
      node.appendChild(box);
    } else if (model.type === 'transportation') {
      node.innerHTML = transportIcon(field(model, record, options));
    } else {
      const text = document.createElement('span');
      text.className = 'album-element-text';
      text.textContent = field(model, record, options);
      text.style.textAlign = model.align || 'center';
      if (model.type === 'instructions') text.style.whiteSpace = 'pre-wrap';
      node.appendChild(text);
    }
    return node;
  }

  /**
   * Renders one card side into container.
   * options: {side, recordId, photoData, photoLoading, photoError, emptyPreview,
   *           samples (placeholder labels), sampleValues ({type: value}), columnMap}
   */
  function render(container, design, record, options) {
    if (!container || !design) return null;
    normalizeTypography(design);
    record = record || {};
    options = Object.assign({}, options);
    if (window.StudioReliability && StudioReliability.photoStates.get(String(record.recordKey || '')) === 'failed') options.photoError = true;
    const side = options.side === 'back' ? 'back' : 'front';
    const spec = cardSpec(design);
    renderContexts.set(container, {design: design, record: record, options: options});
    container.innerHTML = '';

    const card = document.createElement('div');
    card.className = 'album-design-card ' + (spec.width > spec.height ? 'album-landscape' : 'album-portrait');
    card.dataset.recordId = String(options.recordId || record.recordKey || '');
    card.dataset.cardSide = side;
    Object.assign(card.style, {
      width: spec.width + 'px', height: spec.height + 'px',
      background: design.cardColor || '#fff',
      borderColor: design.borderColor || '#98a2b3',
      borderRadius: Number(design.cornerRadius || 0) + 'px'
    });
    if (spec.hole) {
      const hole = document.createElement('div');
      hole.className = 'album-lanyard' + (spec.punch === 'round' ? ' round' : '');
      card.appendChild(hole);
    }
    container.appendChild(card);
    // Elements hidden in Design Studio are never drawn or printed.
    sideElements(design, side).filter(model => !model.hidden).sort((a, b) => (a.z || 0) - (b.z || 0)).forEach(model => {
      const node = renderElement(model, design, record, options);
      card.appendChild(node);
      fitDataElement(node, model);
    });
    return card;
  }

  // ---------- Mapping ----------
  function stableHash(value) {
    let hash = 2166136261;
    String(value || '').split('').forEach(character => {
      hash ^= character.charCodeAt(0);
      hash = Math.imul(hash, 16777619);
    });
    return (hash >>> 0).toString(36);
  }
  /** Data elements of both sides. Assigns a stable id to legacy elements without one. */
  function getDataElements(design) {
    if (!design) return [];
    const output = [];
    ['front', 'back'].forEach(side => {
      sideElements(design, side).forEach((model, index) => {
        if (!model || DESIGN_ONLY_TYPES.includes(model.type)) return;
        if (!model.id) model.id = 'element_' + side + '_' + index + '_' + stableHash(String(model.type || 'data') + '|' + String(model.x || 0) + '|' + String(model.y || 0));
        output.push({id: String(model.id), type: String(model.type || 'text'), label: DATA_LABELS[model.type] || String(model.type || 'Data'), side: side, model: model});
      });
    });
    return output;
  }
  function mappingStorageKey(design, studioType) {
